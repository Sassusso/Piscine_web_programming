<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
</head>
<style>
    html, body{
        height: 100%;
        margin: 0;
    }

    table{
        border: solid 2px black;
        width: 100%;
        height:100vh;
        table-layout:fixed;
        border-collapse: collapse;
    }

    td {
        border: 1px solid gray;
    }
    tr td:nth-child(1){
        background-color: red;
    }

    tr td:nth-child(2){
        background-color: blue;
    }

</style>
<body>

    <table>
        <tbody>
            <tr>
                <td>First cell</td>
                <td>Second cell</td>
            </tr>
        </tbody>
        
    </table>
    
</body>
</html>
