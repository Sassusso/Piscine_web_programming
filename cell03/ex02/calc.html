<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scalele=1.0">
    <title>It's over 9000</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<style>
    body{
        margin: 20px;
        font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
        text-align: center;
        justify-items: center;
    }

    body>form{
        width:400px;
        display: flex;
        flex-direction: column;
    }

    select{
        width: 35px;
        border-radius: 5px;
        padding: 5px 5px 10px 0px;
        
    }

    select:hover{
        
        border: 1px solid blue;
        
    }

    input{
        border: 1px solid gray;
        width: 50px;
        border-radius: 5px;
    }

    input:hover{
        border: 1px solid blue;     
    }

    button{
        margin: 5px;
        border-radius: 15px;
        background-color: black;
        color: white;
        padding: 4px;

    }

    button:hover{
        opacity: 0.9;
        border: 1px solid blue;
    }

</style>
<body>
    <form id="calcForm">

        <div>
            <label>First number</label>

            <input type="text" id="n1" required>
        </div>
        <div>
            <select name="operador" id="operador" required>
                <option value="" disabled>Selecione..</option>
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">x</option>
                <option value="/">/</option>
                <option value="%">%</option>
            </select>
        </div>

        <div>
            <label>Second number</label>
            <input type="text" id="n2" required>
        </div>
        <button type="submit" value="Try me!">Try me!</button>
    </form>
</body>
<script>
    const form = document.getElementById('calcForm');

    form.addEventListener('submit', function (e) {
        e.preventDefault();

        const n1 = document.getElementById("n1").value;
        const n2 = document.getElementById("n2").value;
        const operator = document.getElementById("operador").value;
        
        const right = Number(n2);
        const left = Number(n1);
         
        let result;

        if(!Number.isInteger(left) || !Number.isInteger(right) ||
        left < 0 || right < 0){
            alert("Error :(");
            return;
        }

        if ((operator === "/" || operator === "%") && right === 0) {
            alert("It's over 9000!");
            console.log("It's over 9000!");
            return;
        }

        
        switch (operator) {
            case "-":
                result = left - right;
                break;

            case "+":
                result = left + right;
                break;
        
            case "*":
                result = left * right;
                break;

            case "/":
                result = left / right;
                break;

            case "%":
                
                result = left % right;
                break;

            default:
                alert("error :(");
                return;

        }


        alert(result);
        console.log(result);
    })
     

    setInterval(function(){
        alert("Please, use me...");
    }, 30000);

</script>
</html>
